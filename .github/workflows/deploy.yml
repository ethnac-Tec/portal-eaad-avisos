name: Fetch Notion, build y deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Cada 20 minutos: trae avisos nuevos/aprobados de Notion y republica solo.
    - cron: '*/20 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Traer avisos de Notion
        working-directory: app
        run: npm run fetch:notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Generar vista previa (un solo archivo HTML)
        working-directory: app
        run: npm run build:preview

      - name: Generar build de producción
        working-directory: app
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: vista-previa
          path: app/dist-preview/index.html

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: portal-eaad-noticias
          channelId: live
